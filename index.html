<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的时光树</title>
    <style>
        :root {
            --primary-color: #faccd1;
            --bg-color: #92ccf8;
            --text-color: #e9ecf1;
            --card-bg: #FBEDCA;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* 顶部标题区 */
        header {
            text-align: center;
            padding: 40px 20px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .main-title { font-size: 2.2rem; color: var(--primary-color); margin-bottom: 10px; font-weight: bold; }
        .anniversary { font-size: 1.1rem; color: #a0aab5; letter-spacing: 1px; }
        .big-counter {
            font-size: 1.6rem;
            margin-top: 15px;
            font-weight: bold;
            color: #FFDCA4;
            text-shadow: 0 0 10px rgba(255,79,154,0.3);
        }

        /* === 爱心演示区域 === */
        .heart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
            background: radial-gradient(circle at center, rgba(80, 243, 255, 0), transparent 100%);
        }
        canvas {                                   /* === 调爱心板 === */
            width: min(92vw, 700px);
            height: min(50vh, 700px);
            border-radius: 18px;
              background: #f7d5da;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 15px 40px rgba(0,0,0,.5);
            will-change: transform;
        }
        /* 诗句区域 */
        .poem {
            width: min(92vw, 700px);
            text-align: center;
            line-height: 2;
            font-size: 16px;
            letter-spacing: 1px;
            user-select: none;
            opacity: 0.95;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
            will-change: transform;
            margin-bottom: 20px;
            transition: color 0.5s ease;
        }
        .poem-line { padding: 2px 0; }

        /* 跳动动画 */
        @keyframes pulse {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .pulse {
            animation: pulse 260ms ease-out;
            transform-origin: 50% 50%;
        }

        .settings-menu {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
        }
        .settings-toggle {                     /* === 调设置按钮 === */
            background: #FFDCA4;
            border: none;
            color: #CFEADC; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; font-size: 50px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(230, 169, 2, 0.767);
        }
        .controls {
            position: absolute; top: 50px; right: 0;
            background: rgba(11, 15, 26, 0.95);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 15px; border-radius: 12px;
            display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 260px;
        }
        .controls.show { display: flex; }
        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .panel-label { font-size: 11px; display: flex; justify-content: space-between; align-items: center; color: #ccc; }
        .panel-label input { width: 120px; }
        input[type="color"] { width: 30px; height: 20px; border: none; background: transparent; padding:0;}

        /* === 时光轴生命线区域 === */
        .timeline {
            max-width: 1500px;
            margin: 30px auto 60px;
            position: relative;
            padding: 20px;
        }
        .timeline::after {             /* === 调中间的线 === */
            content: '';
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, #f7b9c0, var(--primary-color));
            top: 0; bottom: 0; left: 50%;
            margin-left: -1px;
        }

        /* 记忆卡片 */
        .memory-card {
            padding: 10px 50px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
        }
        .memory-card::after {           /* === 调线上的爱心 === */
            content: '❤'; 
            position: absolute;
            width: 22px; height: 22px;
            right: -11px; top: 20px;
            background: #0b0f1a;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            z-index: 1;
            text-align: center; font-size: 11px; line-height: 22px; color: var(--primary-color);
        }
        .left { left: 0; text-align: right; }
        .right { left: 50%; text-align: left; }
        .right::after { left: -11px; }

        .content {             /* === 调卡片 === */
            padding: 20px 15px;
          background: #FFDCA4;
            border: 1px solid #ee8c96;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s, border-color 0.3s;
        }
        .content:hover { 
            transform: translateY(-4px); 
            border-color: rgba(255, 107, 107, 0.3);
        }
        .content h3 { margin: 0 0 12px; color: #f77381; font-size: 1.1rem; font-weight: 600; }
        .content p { font-size: 0.95rem; line-height: 1.7; margin: 10px 0; white-space: pre-line; color: #44aaf8; }
        .content img, .content video {
            width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        footer {
            padding: 25px; font-size: 12px; opacity: .5; text-align: center; letter-spacing: 0.5px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media screen and (max-width: 700px) {
            .timeline::after { left: 31px; }
            .memory-card { width: 100%; padding-left: 65px; padding-right: 20px; text-align: left; }
            .memory-card::after { left: 20px; }
            .right { left: 0%; }
        }
        
        /* 悬浮发布按钮 */
        .fab-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 录入弹窗 */
        .modal-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 101;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: #161b26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-sizing: border-box;
        }
        .modal-box h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .form-item {
            margin-bottom: 12px;
        }
        .form-item label {
            display: block;
            font-size: 13px;
            color: #a0aab5;
            margin-bottom: 5px;
        }
        .form-item input[type="text"],
        .form-item input[type="date"],
        .form-item input[type="password"],
        .form-item textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }
        .form-item textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-submit {
            background: var(--primary-color);
            color: white;
        }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }
    </style>
</head>
<body>

<!-- 右上角隐藏的高级控制悬浮窗 -->
<div class="settings-menu">
    <button class="settings-toggle" onclick="document.getElementById('controlsPanel').classList.toggle('show')">♥</button>
    <div class="controls" id="controlsPanel">
        <div class="btn-group">
            <button id="toggle" class="btn">暂停心跳</button>
            <button id="reset" class="btn">重置参数</button>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:5px 0;">
        <label class="panel-label">速度 <input id="speed" type="range" min="0.005" max="0.25" step="0.005" value="0.05"></label>
        <label class="panel-label">振幅 <input id="amp" type="range" min="0" max="1.4" step="0.01" value="0.90"></label>
        <label class="panel-label">密度 <input id="xStep" type="range" min="0.003" max="0.03" step="0.001" value="0.01"></label>
        <label class="panel-label">点大小 <input id="dot" type="range" min="1" max="6" step="0.2" value="2.2"></label>
        <label class="panel-label">发光 <input id="glow" type="range" min="0" max="30" step="1" value="12"></label>
        <label class="panel-label">主色调 <input id="color" type="color" value="#ff4f9a"></label>
    </div>
</div>

<header>
    <div class="main-title">春宝🧡幻宝的时光树🌳</div>     <!-- 🧡春宝和幻宝的时光树🏠🧡 -->
    <div class="anniversary"> 🧑🏻‍❤️‍👩🏻 </div>       <!-- ⏱️起点：2026年1月1日 -->
    <div id="bigCounter" class="big-counter"></div>
</header>

<!-- 前置组合的爱心区域 -->
<div class="heart-container">
    <canvas id="c"></canvas>
    <div id="poem" class="poem">
        <div class="poem-line">我经常好奇，你是谁</div>
        <div class="poem-line">那天，你的心跳与我的脉搏共振</div>
        <div class="poem-line">原来你就是我</div>
    </div>
</div>

<!-- 下方时间轴回忆墙 -->
<div class="timeline" id="timeline"></div>

<footer>
    提示：点击右上角设置可以调节爱心波形，点击右下角加号可以新增记录哦
</footer>

<script>
    // === 1. 恋爱天数统计逻辑 ===
    const startDate = new Date("2026-01-01");
    function getDaysCount(currentDateStr) {
        const current = new Date(currentDateStr);
        const diff = current - startDate;
        return Math.floor(diff / (1000 * 60 * 60 * 24)) ;
    }
    const today = new Date();
    document.getElementById('bigCounter').innerText = `我们已经同舟共济${getDaysCount(today)}天`;

    // === 2. 爱心 Canvas 渲染核心算法 ===
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function resize() {
        const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        canvas.width  = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener("resize", resize);
    resize();

    // 控制面板元素绑定
    const el = (id) => document.getElementById(id);
    const speed = el("speed"), amp = el("amp"), xStep = el("xStep"), dot = el("dot"), color = el("color"), glow = el("glow");
    const poemEl = el("poem");

    // 预设自动循环变换的彩虹色盘
       const palette = ["#FF97A5",  "#FCD353","#FD8B64", "#CFEADC", "#FFEFB9", "#FEB78D"];
    let paletteIndex = 0;

    function applyColor(hex){
        color.value = hex;
        poemEl.style.color = hex;
    }

    function pulseOnce(){
        canvas.classList.remove("pulse");
        poemEl.classList.remove("pulse");
        void canvas.offsetWidth; // 触发重绘
        canvas.classList.add("pulse");
        poemEl.classList.add("pulse");
        setTimeout(() => {
            canvas.classList.remove("pulse");
            poemEl.classList.remove("pulse");
        }, 300);
    }

    // 定时换色与频率跳动
    applyColor(palette[paletteIndex]);
    setInterval(() => {
        paletteIndex = (paletteIndex + 1) % palette.length;
        applyColor(palette[paletteIndex]);
        pulseOnce();
    }, 2000);

    color.addEventListener("input", () => {
        poemEl.style.color = color.value;
        pulseOnce();
    });

    // 数学心脏方程公式
    const X_MIN = -1.81, X_MAX = 1.81, SQRT_A = 3.3;
    let k = 0, running = true;

    function heartY(x, kVal, ampVal){
        const x2 = x*x;
        const base = Math.pow(x2, 1/3);
        const inside = SQRT_A - x2;
        const wave = inside > 0 ? Math.sqrt(inside) : 0;
        return base + ampVal * wave * Math.sin(kVal * Math.PI * x);
    }

    function render(){
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;
        ctx.clearRect(0,0,w,h);

        const step = Number(xStep.value), ampV = Number(amp.value), dotSize = Number(dot.value);
        let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
        const pts = [];

        for(let x=X_MIN; x<=X_MAX+1e-9; x+=step){
            const y = heartY(x, k, ampV);
            pts.push([x,y]);
            if(x<minX) minX=x; if(x>maxX) maxX=x;
            if(y<minY) minY=y; if(y>maxY) maxY=y;
        }

        const pad = 0.12;
        const dx = (maxX - minX) || 1; const dy = (maxY - minY) || 1;
        minX -= dx*pad; maxX += dx*pad; minY -= dy*pad; maxY += dy*pad;

        const mapX = (x)=> (x - minX) / (maxX - minX) * w;
        const mapY = (y)=> h - (y - minY) / (maxY - minY) * h;

        ctx.save();
        ctx.fillStyle = color.value;
        ctx.shadowColor = color.value;
        ctx.shadowBlur = Number(glow.value);

        for(const [x,y] of pts){
            ctx.beginPath();
            ctx.arc(mapX(x), mapY(y), dotSize, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }

    function tick(){
        if(running) k += Number(speed.value);
        render();
        requestAnimationFrame(tick);
    }
    tick();

    // 暂停/重置动作分配
    const toggleBtn = el("toggle");
    toggleBtn.addEventListener("click", ()=> {
        running = !running;
        toggleBtn.textContent = running ? "暂停心跳" : "开启心跳";
    });
    el("reset").addEventListener("click", ()=> { k = 0; render(); });

    
    // === 配置项（请修改为你自己的 GitHub 仓库信息）===
    const GH_USER = "SW-19";                    // 你的 GitHub 用户名
    const GH_REPO = "SpringFancy";           // 网页项目仓库名
    const IMAGE_REPO = "ImageBed";              // 存放图片的仓库名

    // 打开/关闭弹窗
    function openModal() {
        document.getElementById('formDate').valueAsDate = new Date();
        const savedToken = localStorage.getItem('love_gh_token');
        if (savedToken) {
            document.getElementById('formToken').value = savedToken;
        }
        document.getElementById('uploadModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('uploadModal').style.display = 'none';
    }

    // 页面加载时从 memories.json 获取数据并渲染
    fetch('./memories.json?t=' + Date.now())
        .then(res => {
            if (!res.ok) throw new Error("未能读取到 memories.json");
            return res.json();
        })
        .then(data => {
            renderTimeline(data);
        })
        .catch(err => {
            console.error(err);
            document.getElementById('timeline').innerHTML = '<p style="text-align:center;">请确保在仓库根目录创建了 memories.json 文件哦。</p>';
        });

    function renderTimeline(memories) {
        memories.sort((a, b) => new Date(b.date) - new Date(a.date));
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        memories.forEach((item, index) => {
            const days = getDaysCount(item.date);
            const side = index % 2 === 0 ? 'left' : 'right';
            const mediaTag = item.url ? `<img src="${item.url}" alt="memory">` : '';
            const card = `
                <div class="memory-card ${side}">
                    <div class="content">
                        <h3>${item.date} · 第 ${days} 天</h3>
                        <p><strong>${item.title}</strong></p>
                        <p>${item.thought}</p>
                        ${mediaTag}
                    </div>
                </div>
            `;
            timeline.innerHTML += card;
        });
    }

    // 工具函数：文件转 Base64 纯文本
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    // 提交逻辑
    async function submitNewMemory() {
        const tokenInput = document.getElementById('formToken').value.trim();
        if (!tokenInput) {
            alert('输入暗号才能上传回忆哦！');
            return;
        }
        // 保存到当前浏览器的 localStorage，下次不需要重复输入
        localStorage.setItem('love_gh_token', tokenInput);
        const GH_TOKEN = tokenInput;
        
        const date = document.getElementById('formDate').value;
        const title = document.getElementById('formTitle').value.trim();
        const thought = document.getElementById('formThought').value.trim();
        const fileInput = document.getElementById('formFile');
        const submitBtn = document.getElementById('submitBtn');

        if (!date || !title) {
            alert('请填写日期和标题哦！');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = '正在上传...';

        try {
            let imageUrl = "";

            // 1. 如果选择了图片，先通过 API 上传到 ImageBed 仓库
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const base64Content = await fileToBase64(file);
                const ext = file.name.split('.').pop();
                const fileName = `${date.replace(/-/g, '')}-${Date.now()}.${ext}`;

                const uploadImgRes = await fetch(`https://api.github.com/repos/${GH_USER}/${IMAGE_REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload photo: ${fileName}`,
                        content: base64Content
                    })
                });

                if (!uploadImgRes.ok) throw new Error('图片上传失败，请检查暗号是否正确');
                // 获取 raw 直链
                imageUrl = `https://raw.githubusercontent.com/${GH_USER}/${IMAGE_REPO}/refs/heads/main/${fileName}`;
            }

            // 2. 获取当前的 memories.json 现有内容和 SHA 校验码
            const getFileRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/memories.json`, {
                headers: { 'Authorization': `token ${GH_TOKEN}` }
            });
            if (!getFileRes.ok) throw new Error('无法读取 memories.json，请确认仓库名是否正确且文件存在');
            
            const fileData = await getFileRes.json();
            // Base64 解码，包含对中文字符的处理
            const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));

            // 3. 追加新数据
            currentContent.unshift({
                date: date,
                title: title,
                thought: thought,
                type: "image",
                url: imageUrl
            });

            // 4. 将更新后的 JSON 写回 GitHub 仓库
            const updatedJsonStr = JSON.stringify(currentContent, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonStr)));

            const updateRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/memories.json`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GH_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Add memory: ${date} - ${title}`,
                    content: encodedContent,
                    sha: fileData.sha // 更新文件必须提供原有 SHA
                })
            });

            if (!updateRes.ok) throw new Error('回忆写入失败，外人免入！');

            alert('今日记录上传成功！大概 30 秒后刷新，即看到我们的时光树长大！');
            closeModal();
        } catch (err) {
            alert('出错啦: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '发布';
        }
    }
</script>

<!-- 悬浮发布按钮 -->
<button class="fab-btn" onclick="openModal()">＋</button>

<!-- 录入回忆弹窗 -->
<div class="modal-mask" id="uploadModal">
    <div class="modal-box">
        <h3>✨ 记录新瞬间</h3>
        <div class="form-item">
            <label>日期</label>
            <input type="date" id="formDate">
        </div>
        <div class="form-item">
            <label>标题</label>
            <input type="text" id="formTitle" placeholder="写个浪漫的标题...">
        </div>
        <div class="form-item">
            <label>感想</label>
            <textarea id="formThought" placeholder="当天的所为所思所感（直接回车即可换行）..."></textarea>
        </div>
        <div class="form-item">
            <label>照片（可选）</label>
            <input type="file" id="formFile" accept="image/*" style="color:#aaa;">
        </div>
        <div class="form-item">
            <label>发布密钥 / 暗号</label>
            <input type="password" id="formToken" placeholder="首次输入后会自动保存在本地">
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-submit" id="submitBtn" onclick="submitNewMemory()">发布</button>
        </div>
    </div>
</div>
</body>
</html>
